name: Paragon Solutions
description: >-
  Paragon Solutions Ltd is an Israeli cyber-intelligence and surveillance
  software vendor founded in 2019 in Tel Aviv by former Unit 8200 commander Ehud
  Schneorson together with Idan Nurick, Igor Bogudlov and Liad Avraham, with Ehud
  Barak among its backers. Its flagship product, Graphite, is mobile-device
  intelligence software marketed to government and law-enforcement agencies.
  Battery Ventures took an early-stage stake in the company; in 2024 Paragon was
  acquired by AE Industrial Partners and merged with the US cybersecurity firm
  RED Lattice. Surfaced as a Battery Ventures portfolio company and added to the
  API Evangelist network as a lead, Paragon operates no public developer
  platform: it publishes no API, SDKs, documentation, or self-service sign-up,
  and its domain (paragonsolutions.io) currently serves no website. There is no
  public API surface to enrich.
